<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Support — Salta! AI Life Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #fafafa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 24px;
      }
      .container {
        max-width: 520px;
        width: 100%;
      }
      a {
        color: #ffa2ed;
        text-decoration: none;
      }
      a:hover {
        opacity: 0.8;
      }
      .back {
        color: #666;
        font-size: 13px;
        margin-bottom: 32px;
        display: inline-block;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 24px;
      }
      p {
        font-size: 15px;
        color: #999;
        line-height: 1.7;
        margin-bottom: 16px;
      }
      .email {
        font-size: 18px;
        color: #fafafa;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/salta" class="back">&larr; Back to Salta!</a>
      <h1>Support</h1>
      <p>
        Need help with Salta!? Have a question, bug report, or feature request?
        I'd love to hear from you.
      </p>
      <p class="email">
        <a href="mailto:yigitcagriakkaya@gmail.com">yigitcagriakkaya@gmail.com</a>
      </p>
      <p>I typically respond within 24 hours.</p>
      <p style="margin-top: 32px; color: #444; font-size: 13px">
        Salta! v1.0 &middot; Made by
        <a href="/" style="color: #666">Yigit Cagri Akkaya</a>
      </p>
    </div>
  </body>
</html>
